name: macOS Build & Analyze

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-analyze:
    name: Build & Static Analysis
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "::group::Available Xcode installations"
          ls -d /Applications/Xcode* 2>/dev/null || true
          echo "::endgroup::"

          # macos-15 provides Xcode 16.2 (Swift 6.0). Type-level `nonisolated`
          # is a newer compiler feature and is not used in this project.
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi

          echo "Active Xcode Version:"
          xcodebuild -version

      - name: Inspect Project and Schemes
        run: |
          xcodebuild -list -project Animatto.xcodeproj

      - name: Build macOS Application
        run: |
          xcodebuild -project "Animatto.xcodeproj" \
                     -scheme "Animatto" \
                     -configuration Debug \
                     -destination 'platform=macOS' \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

      - name: Run Static Analysis
        run: |
          xcodebuild -project "Animatto.xcodeproj" \
                     -scheme "Animatto" \
                     -configuration Debug \
                     -destination 'platform=macOS' \
                     CODE_SIGNING_ALLOWED=NO \
                     analyze

      - name: Run Unit Tests
        run: |
          mkdir -p /tmp/swift_cache
          swiftc -DDEBUG \
                 -sdk $(xcrun --show-sdk-path) \
                 -module-cache-path /tmp/swift_cache \
                 $(ls Animatto/*.swift | grep -v AnimattoApp.swift) \
                 Tests/AnimattoTests.swift \
                 -o /tmp/animatto_unit_tests
          /tmp/animatto_unit_tests

      - name: Verify Release Packaging Workflow
        run: |
          brew install create-dmg || true
          chmod +x scripts/build-and-package.sh
          ./scripts/build-and-package.sh --skip-notarization
          test -f dist/Animatto-v1.2.0.dmg
          test -f dist/SHA256SUMS.txt
